version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR so a week of routine updates is one
      # review instead of eight. Majors stay individual: those are the ones worth
      # reading before merging.
      #
      # `update-types` inside a group takes bare semver levels ("minor"), NOT the
      # "version-update:semver-minor" spelling that `ignore.update-types` uses.
      # The two vocabularies differ and a wrong one is silently ignored.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # drizzle-kit's `generate` output is only deterministic for a fixed version,
      # and scripts/check-migrations.ts compares schema.ts against drizzle/ by
      # generating into a scratch name. A minor bump can therefore start producing
      # a diff on a schema nobody touched, turning every pull request red for a
      # dependency update. Bumping this is deliberate work: raise it by hand, run
      # `bun run db:check`, and confirm it reports no drift before merging.
      - dependency-name: drizzle-kit

      # drizzle-orm ships alongside drizzle-kit and the two are matched pairs; a
      # migration generated from a mismatched pair is the failure mode this whole
      # check exists to catch. Update them together, by hand.
      #
      # No @drizzle-orm/* scope rule: this project imports none of those packages,
      # and an ignore line for a package that does not exist is config that reads
      # like it does something.
      - dependency-name: drizzle-orm

      # Nitro is pinned to a release candidate, so Dependabot would happily offer
      # every new rc - and an rc is exactly the kind of thing that needs reading.
      # Only stable 3.1.0 and above are ignored; pre-release tags are not semver
      # comparable, so they are left to arrive and be reviewed.
      - dependency-name: nitro
        versions:
          - '>=3.1.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
